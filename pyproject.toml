[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wind-wake-shadow"
version = "0.1.0"
description = "Wake and shadow flicker maps for the open Kelmarsh wind farm: PyWake engineering wake models checked against SCADA, and an analytic shadow flicker model."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scipy>=1.11",
    "requests>=2.31",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "py_wake>=2.6",
    "h5py>=3.10",  # PyWake reads the Gaussian rotor-overlap lookup table with h5netcdf
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wind-wake-shadow = "wind_wake_shadow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
